name: Keep Supabase awake

# Free Supabase projects pause after a week without activity (e.g. school breaks).
# This pings the database every 3 days. It reads no data.
on:
  schedule:
    - cron: '17 14 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          curl -fsS -X POST \
            "https://gktonohflltwwbjcanxl.supabase.co/rest/v1/rpc/ping" \
            -H "apikey: sb_publishable_t84cuaGIbOlCvs6F6-OY7g_kC0ziRsz" \
            -H "Content-Type: application/json" \
            -d '{}'
